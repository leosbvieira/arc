# Portão do Aeternum (projects/escritorio).
#
# Nenhum dos dois workflows existentes tem filtro de path que possa casar com
# `projects/escritorio/**`, e `.git/hooks` só tem `.sample`: as 665 do pytest, as 169
# do node e o tsc só rodavam quando alguém lembrava. Este é o portão que faltava.
#
# Ele também PROVA uma coisa que só o CI consegue provar: o runner não tem `bff/.env`,
# então uma suíte verde aqui é evidência de que ela não depende das credenciais reais
# do Leo. O conftest já neutraliza as credenciais e bloqueia socket; aqui isso deixa
# de ser promessa e vira fato observável a cada push.
name: Aeternum (escritorio)

on:
  push:
    branches:
      - main
    paths:
      - "projects/escritorio/**"
      - ".github/workflows/escritorio.yml"
  pull_request:
    paths:
      - "projects/escritorio/**"
      - ".github/workflows/escritorio.yml"

# Um push novo cancela a rodada anterior do mesmo ref: o Leo trabalha sozinho e
# esperar CI de commit já superado não serve pra nada.
concurrency:
  group: escritorio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bff:
    name: BFF (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/escritorio/bff
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            projects/escritorio/bff/requirements.txt
            projects/escritorio/bff/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Confirmar que não há .env no runner
        # Se algum dia um `.env` entrar no repo por engano, o teste abaixo passaria
        # lendo segredo de verdade — e o valor deste job inteiro iria embora calado.
        run: test ! -f .env

      - name: pytest
        run: python -m pytest -q

  app:
    name: App (tsc + node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/escritorio/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # O runner do repo tem Node 24, e a suíte depende disso: ela importa `.ts`
          # direto (type stripping nativo) e o ESM do 24 exige extensão explícita.
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/escritorio/app/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: typecheck + testes
        run: npm run check
