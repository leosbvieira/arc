[pytest]
asyncio_mode = auto
testpaths = tests
# deprecation ambiental do venv (import de fastapi.testclient), não nosso código
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
markers =
    hermes_oneshot: o teste exercita o proprio _oneshot; nao stuba o Hermes
    rede_de_verdade: o teste precisa de socket real; libera o bloqueio do conftest
